for (const [name, sprite] of Object.entries(SPRITES)) {
  const width = sprite.rows[0].length;
  sprite.rows.forEach((row, i) => {
    if (row.length !== width) throw new Error(`${name} row ${i} is ${row.length} wide, expected ${width}`);
  });
}

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * U, y * U, w * U, h * U);
}

function sprite(name, x, y, outline = true) {
  const { map, rows, scale: s = 1 } = SPRITES[name];
  if (outline) {
    rows.forEach((row, j) => [...row].forEach((ch, i) => {
      if (ch !== " ") for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) rect(x + (i + dx) * s, y + (j + dy) * s, s, s, C.outline);
    }));
  }
  rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== " ") rect(x + i * s, y + j * s, s, s, map[ch]); }));
}

const CJK = /[\u3000-\u9fff\uff00-\uffef]/;

// Chinese text uses Fusion Pixel at a multiple of its 12-pixel grid, so it stays sharp.
function textFont(str, size, font) {
  const px = size * U / 4;
  if (LANG === "zh" && (font === "FusionPixel" || CJK.test(str))) return `${12 * Math.max(1, Math.round(px / 12))}px FusionPixel`;
  return `${px}px ${font}`;
}

function text(str, x, y, { size = 16, color = C.ink, align = "left", font = "Silkscreen" } = {}) {
  ctx.font = textFont(str, size, font);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = "top";
  ctx.fillText(str, x * U, y * U);
}

// ---- time ---------------------------------------------------------------
// renderAt(t) draws the frame at t seconds; the same t always draws the same frame.
const DURATION = 36.6;
// The story runs on two clocks. REAL is the time in the loop. STORY is the time of the work in the kitchen;
// it pauses while the head chef and the designer talk (REAL 3 to 12.1) and then runs 4.6 s behind REAL.
const TALK_END = 12.1, SHIFT = 4.6;
let REAL = 0, STORY = 0;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2);
const lerp = (a, b, p) => a + (b - a) * p;
const half = (v) => Math.round(v * 2) / 2;                 // moving things stay on the half-unit grid
const tick = (t, fps) => Math.floor((t - STORY + REAL) * fps);  // stepped idle animation, always on REAL time
const noise = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---- story --------------------------------------------------------------
const CAPTIONS_EN = [

// Which parts of the kitchen are lit; the rest is dimmed.
// The resource panel is never dimmed.
const REGIONS = { head: [0, 0, 180, 34], pass: [0, 34, 180, 46], line: [0, 80, 180, 44] };
const FOCUS = [  // in REAL time
  [0, 1, ["head"]], [1, 2, ["pass"]], [2, 3, ["line"]],
  [3, 12.1, ["head", "pass"]], [12.1, 14.6, ["pass"]], [14.6, 19.1, ["pass", "panel", "line"]],
  [19.1, 23.6, ["pass", "line"]], [23.6, 28.6, ["pass", "line"]], [28.6, 32.6, ["head", "pass", "panel"]],
];

function lit(region, t) {
  const at = (u) => { const w = FOCUS.find(([a, b]) => u >= a && u < b); return !w || w[2].includes(region) ? 1 : 0; };
  let sum = 0;
  for (let k = -2; k <= 2; k++) sum += at(t + k * 0.12);
  return sum / 5;
}

// The ticket rail: six slots; #17 arrives, #13 leaves.
const SLOT = (i) => 72 + i * 17;
function tickets(t) {
  const order = t < 22.8 ? ["#12", "#13", "#14", "#15", "#16", "#17"] : ["#12", "#14", "#15", "#16", "#17"];
  const slide = ease(prog(t, 22.8, 23.4));
  const before = { "#12": 0, "#14": 2, "#15": 3, "#16": 4, "#17": 5 };
  return order.map((label, i) => {
    let x = SLOT(t < 22.8 ? i : lerp(before[label], i, slide)), y = 42.5, alpha = 1;
    if (label === "#17") {
      if (REAL < 11.0) return null;
      const f = ease(prog(REAL, 11.0, 11.8));
      x = lerp(30, x, f); y = lerp(60, y, f);
    }
    if (label === "#13") alpha = 1 - prog(t, 22.4, 22.8);
    return { label, x, y, alpha, checked: label === "#17" && t >= 8.3, flagged: label === "#14" && t >= 14.5 && t < 17.7 };
  }).filter(Boolean);
}

const callsAt = () => Math.round(812 + 30 * (Math.min(REAL, 19.1) + Math.max(0, REAL - 22.3)));

// ---- drawing helpers -----------------------------------------------------
function alpha(a, draw) { ctx.save(); ctx.globalAlpha *= a; draw(); ctx.restore(); }

function ring(cx, cy, r, color) {
  for (let k = 0; k < 48; k++) {
    const a = (k / 48) * Math.PI * 2;
    rect(half(cx + Math.cos(a) * r), half(cy + Math.sin(a) * r * 0.6), 0.75, 0.75, color);
  }
}

function check(x, y, color) {
  [[0, 2], [1, 3], [2, 2], [3, 1], [4, 0]].forEach(([dx, dy]) => rect(x + dx, y + dy, 1, 1, color));
}

function note(x, y, label) {
  rect(half(x) - 0.5, half(y) - 0.5, 7, 5, C.outline);
  rect(half(x), half(y), 6, 4, "#efe6cf");
  rect(half(x) + 1, half(y) + 1.25, 4, 0.5, "#9b8f78");
  rect(half(x) + 1, half(y) + 2.5, 3, 0.5, "#9b8f78");
  if (label) text(label, half(x) + 3, half(y) - 4.5, { size: 12, color: C.ink, align: "center" });
}

function fly(t, a, b, from, to, label, lift = 10) {
  if (t < a || t > b) return;
  const p = ease(prog(t, a, b));
  note(lerp(from[0], to[0], p), lerp(from[1], to[1], p) - Math.sin(p * Math.PI) * lift, label);
}

function bandTitle(str, y, color) {
  rect(3, y + 0.5, 1.5, 1.5, color);
  text(str, 6, y - 0.5, { size: 16, color: C.muted });
}

function bubble(x, y, w, h, lines, tailX) {
  rect(x - 0.5, y - 0.5, w + 1, h + 1, C.outline);
  rect(x, y, w, h, "#f4efe6");
  for (let k = 0; k < 3; k++) rect(tailX + k, y + h + k * 0.5 - 0.5, 3 - k, 1, "#f4efe6");
  lines.forEach(([str, color], i) => text(str, x + 3, y + 2 + i * 4.5, { size: 12, color: color || "#2a2622" }));
}

// ---- the kitchen ---------------------------------------------------------
function background() {
  rect(0, 0, 180, 124, C.wall);
  for (let y = 40; y < 80; y += 5) rect(0, y, 180, 0.25, C.tile);
  for (let x = 0; x < 180; x += 8) rect(x, 34, 0.25, 46, C.tile);
  rect(0, 0, 180, 34, C.band1);
  rect(0, 80, 180, 44, C.floor);
  rect(0, 34, 180, 0.5, C.line);
  rect(0, 80, 180, 0.5, C.line);
}

const SIPS = [[1.0, 2.2], [13.2, 14.4], [20.8, 22.0], [26.2, 27.4]];  // REAL time

function headChef(t) {
  bandTitle(L("HEAD CHEF · YOU", "主厨 · 你"), 3, "#e8e2d6");
  sprite("chef", 82, 3);
  // the spoon gives way to a stamp while a decision is on the table
  const stamping = t >= 25.5 && t < 26.8;
  if (!stamping) { sprite("spoon", 82, 18); rect(82.5, 24, 2.5, 2, "#f0c39e"); }
  rect(66, 25.5, 48, 2, "#7a5638");
  rect(66, 27.5, 48, 5.5, "#5e4129");
  rect(68, 29.5, 44, 0.5, "#6e4c31");
  // now and then the head chef takes a sip of coffee
  const sip = SIPS.map(([a, b]) => Math.min(ease(prog(REAL, a, a + 0.35)), 1 - ease(prog(REAL, b - 0.35, b)))).reduce((m, v) => Math.max(m, v), 0);
  const mx = half(lerp(103, 94, sip)), my = half(lerp(20.5, 12, sip));
  sprite("mug", mx, my);
  if (sip > 0) rect(mx + 4.5, my + 2.5, 2.5, 2, "#f0c39e");
  if (sip < 0.05) {
    const s = tick(t, 4) % 3;
    rect(104, 16.5 - s * 0.5, 0.5, 2, C.muted);
    rect(106, 15.5 + (s % 2) * 0.5, 0.5, 2, C.muted);
  }

  // the report card
  if (t >= 24.9 && t < 26.9) {
    alpha(prog(t, 24.9, 25.1) * (1 - prog(t, 26.6, 26.9)), () => {
      bubble(10, 6, 64, 25, LANG === "zh"
        ? [["汇报", "#8a8378"], ["#13 已合并，#17 在跑"], ["待定：#14 再加 1.2k 次调用？"], ["约 $12", "#8a8378"]]
        : [["REPORT", "#8a8378"], ["#13 merged, #17 running"], ["decide: #14 +1.2k calls?"], ["cost about $12", "#8a8378"]], 72);
      if (t >= 26.1) {
        rect(55, 22.5, 15, 7, "#3f8f4e");
        rect(56, 23.5, 13, 5, "#e9f6ea");
        text(L("OK", "批准"), 62.5, 24, { size: 12, color: "#2f7a3e", align: "center" });
      }
    });
  }
  fly(t, 24.0, 24.9, [80, 60], [40, 16], "", 8);
  fly(t, 26.6, 27.5, [40, 16], [88, 58], "", 8);
  if (stamping) {
    const down = t < 26.1 ? ease(prog(t, 25.5, 26.0)) : 1 - ease(prog(t, 26.2, 26.7));
    const sx = lerp(84, 61, ease(prog(t, 25.5, 25.8))), sy = lerp(12, 16.5, down);
    rect(sx - 0.5, sy - 0.5, 4, 5, C.outline);
    rect(sx, sy, 3, 4, "#7a5638");
    rect(sx - 1.5, sy + 4, 6, 2, "#3f8f4e");
  }
}

function crab(x, y, t, phase) {

  rect(8, 64, 164, 2, C.steelHi);
  rect(8, 66, 164, 9, C.steel);

  // bell rings at 11.0

  if (t >= 11 && t < 12.2) {
    for (let k = 0; k < 3; k++) {
      const p = prog(t, 11 + k * 0.2, 11.8 + k * 0.2);
      if (p > 0 && p < 1) alpha(1 - p, () => ring(109, 60, 4 + p * 14, C.brass));

function meters(t) {
  const busy = ease(prog(t, 12.8, 13.8));
  const jitter = (i) => (noise(tick(t, 2) + i * 5) - 0.5) * 0.04;
  const spent = 38 + (callsAt() - 812) * 0.01;
  const clock = 2 * 3600 + 14 * 60 + 37 + Math.floor(REAL * 113);
  const two = (n) => String(n).padStart(2, "0");
  return {
    gpus: [0.92 + jitter(0), 0.88 + jitter(1), 0.71 * busy, 0.68 * busy],
    rows: [[L("API BUDGET", "API 预算"), `$${spent.toFixed(0)} / $100`, spent / 100, C.claude],
           [L("TOKENS TODAY", "今日 TOKEN"), `${(1.2 + REAL * 0.012).toFixed(2)}M`, 0.55 + REAL * 0.005, "#9fbf7a"],
           [L("CPU JOBS", "CPU 任务"), "6 / 16", 0.375, C.codex]],
    clock: `${two(Math.floor(clock / 3600))}:${two(Math.floor(clock / 60) % 60)}:${two(clock % 60)}`,
    waiting: t >= 24.5 && t < 26.6 ? 1 : 0,
    gpuBlink: t >= 10 && t < 11 && tick(t, 6) % 2,
    waitBlink: tick(t, 4) % 2,
  };
}

// Splits a caption into lines that fit; Chinese can break anywhere, English breaks at spaces.
function wrap(str, width) {
  const lines = [""];
  for (const token of str.match(/[\u3000-\u9fff\uff00-\uffef]|[^\s\u3000-\u9fff\uff00-\uffef]+|\s+/g) || []) {
    const next = lines[lines.length - 1] + token;
    if (ctx.measureText(next).width > width && lines[lines.length - 1].trim()) lines.push(token.trimStart());
    else lines[lines.length - 1] = next;
  }
  return lines;
}

function caption(t) {
  const tall = LAYOUT === "tall";
  const [top, height] = tall ? [206, 34] : [124, 11];
  rect(0, top, canvas.width / U, height, "#0f0e0d");
  rect(0, top, canvas.width / U, 0.5, C.line);
  const [start, str] = CAPTIONS.filter(([at]) => at <= t).pop();
  const font = LANG === "zh" ? "FusionPixel" : "VT323";
  const size = LANG === "zh" ? 24 : 30;   // zh snaps to 24 px (wide) or 36 px (tall)
  ctx.font = textFont(str, size, font);
  const lines = tall ? wrap(str, canvas.width - 8 * U) : [str];
  let left = Math.floor((t - start) * 90);
  const cursor = tick(t, 2) % 2 ? "▌" : "";
  const lineHeight = tall ? 8 : 0;
  lines.forEach((line, i) => {
    const shown = line.slice(0, Math.max(0, left));
    const typing = left > 0 && left <= line.length;
    left -= line.length;
    if (!shown && i > 0) return;
    const last = i === lines.length - 1;
    text(shown + (typing && shown.length < line.length ? "▌" : last && left >= 0 ? cursor : ""), 4,
         top + (tall ? 4 : 1.5) + i * lineHeight, { size, font, color: "#d8d2c4" });
  });
}

function dim(t) {
  ctx.fillStyle = "rgba(10,9,8,1)";
  for (const [name, [x, y, w, h]] of Object.entries(REGIONS)) {
    const a = (1 - lit(name, t)) * 0.6;
    if (a > 0) { ctx.globalAlpha = a; ctx.fillRect(x * U, y * U, w * U, h * U); }
  }
  ctx.globalAlpha = 1;
}

  REAL = ((t % DURATION) + DURATION) % DURATION;
  STORY = REAL < 3 ? REAL : REAL < TALK_END ? 2.99 : REAL - SHIFT;
  t = STORY;
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.wall;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (LAYOUT === "tall") header();
  ctx.save();
  ctx.translate(0, (LAYOUT === "tall" ? 30 : 0) * U);
  background();
  headChef(t);
  pass(t);
  line(t);
  talk(REAL);
  dim(REAL);
  ctx.restore();
  resources(t);
  caption(REAL);
  endCard(t);
  // fade through black at the loop point
  const black = Math.max(1 - prog(REAL, 0, 0.5), prog(REAL, DURATION - 0.6, DURATION));
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
}

Promise.all([...["16px Silkscreen", "30px VT323", "12px FusionPixel"].map((font) => document.fonts.load(font, "a中")),
             new Promise((resolve) => { LOGO.onload = resolve; LOGO.onerror = resolve; })])
  .then(() => {
    document.body.dataset.ready = "1";
    if (PARAMS.has("t")) { renderAt(Number(PARAMS.get("t"))); return; }
    const begin = performance.now();
    const loop = (now) => { renderAt((now - begin) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
</script>
