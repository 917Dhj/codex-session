[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dkitchen"
version = "0.1.0"
description = "Message agent sessions and wake them after task completion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "917Dhj"}]
dependencies = ["websocket-client>=1.9,<2"]
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ding = "ding:main"
codex-session = "ding:main"

[project.urls]
Repository = "https://github.com/917Dhj/dkitchen"

[tool.setuptools]
py-modules = ["ding"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
