[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session"
version = "0.1.0"
description = "Read and message Codex sessions, with conditional job-exit wakeups"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "917Dhj"}]
dependencies = ["websocket-client>=1.9,<2"]
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codex-session = "codex_session:main"

[project.urls]
Repository = "https://github.com/917Dhj/codex-session"

[tool.setuptools]
py-modules = ["codex_session"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
